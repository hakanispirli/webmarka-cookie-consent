name: Feature request
description: Suggest an idea or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and why is it hard today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
  - type: textarea
    id: legal
    attributes:
      label: Legal / compliance references (if relevant)
      description: For changes to consent behavior, link the regulation or guideline (KVKK, GDPR, EDPB, Google docs...).
